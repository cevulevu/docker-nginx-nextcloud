volumes:
  nextcloud:
  db:
networks:
  dbnet:
  redisnet:
  proxynet:
services:
  proxy:
    build: ./nginx-custom
    restart: always
    ports:
      - 8080:80
    depends_on:
      - app
    networks:
      - proxynet
  db:
    image: mariadb:10.6
    restart: always
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    volumes:
      - db:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
    networks:
      - dbnet
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
  app:
    image: nextcloud
    restart: always
    volumes:
      - nextcloud:/var/www/html
    networks:
      - redisnet
      - dbnet
      - proxynet
    environment:
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_HOST=db
      - REDIS_HOST=redis
    depends_on:
      db:
        condition: service_healthy
  redis:
    image: redis:alpine
    restart: always
    networks:
      - redisnet
